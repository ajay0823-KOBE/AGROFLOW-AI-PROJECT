<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Procurement Centres – AgriFlow AI</title>
  <link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="nav" data-menu="public"></nav>

  <!-- Notice text set by the admin -->
  <div class="bar alert alert-warning rounded-0 mb-0 text-center py-2" id="siteNotice"></div>

  <div class="container py-4">
    <div class="page-head">
      <div class="label">Network</div>
      <h1>Procurement centres</h1>
      <p class="text-muted">Mandis and APMC yards linked to AgriFlow – free slots, crops accepted, and booking.</p>
    </div>

    <input id="search" class="form-control mb-3" placeholder="Search centre or city…" oninput="showCentres()" style="max-width:360px">
    <div class="grid-2" id="centreList"></div>
  </div>

  <script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../js/app.js"></script>
  <script>
    function showCentres() {
      const text = document.getElementById('search').value.toLowerCase();
      const list = CENTRES.filter(c => (c.name + ' ' + c.place).toLowerCase().includes(text));
      document.getElementById('centreList').innerHTML = list.map(c => `
        <div class="card">
          <h3>${c.name}</h3>
          <p class="text-muted">📍 ${c.place}</p>
          <p><b>${c.free} / ${c.cap}</b> slots free today</p>
          <p>${c.crops.map(crop => `<span class="tag">${crop}</span>`).join('')}</p>
          <a class="btn btn-primary btn-sm" href="book.html">Book slot</a>
        </div>`).join('') || '<p class="empty">No centre found.</p>';
    }
    showCentres();
  </script>
</body>
</html>
