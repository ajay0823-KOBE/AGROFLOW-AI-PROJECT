<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Government Schemes – AgriFlow AI</title>
  <link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="nav" data-menu="public"></nav>

  <div class="container py-4">
    <div class="page-head">
      <div class="label">Support</div>
      <h1>Government schemes</h1>
      <p class="text-muted">Income support, insurance, MSP procurement, credit and market access.</p>
    </div>

    <div class="alert alert-success mb-3">
      📊 Your AgriFlow credit score helps with Kisan Credit Card and loan enquiries – see the Farmer portal.
    </div>

    <div class="chips" id="filters">
      <button class="btn btn-sm btn-outline-primary rounded-pill active">All</button>
      <button class="btn btn-sm btn-outline-primary rounded-pill">Income</button>
      <button class="btn btn-sm btn-outline-primary rounded-pill">Insurance</button>
      <button class="btn btn-sm btn-outline-primary rounded-pill">Procurement</button>
      <button class="btn btn-sm btn-outline-primary rounded-pill">Credit</button>
      <button class="btn btn-sm btn-outline-primary rounded-pill">Input</button>
      <button class="btn btn-sm btn-outline-primary rounded-pill">Market</button>
    </div>

    <div class="grid-2" id="schemeList"></div>
  </div>

  <script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../js/app.js"></script>
  <script>
    function showSchemes(tag) {
      const list = SCHEMES.filter(s => tag === 'All' || s.tag === tag);
      document.getElementById('schemeList').innerHTML = list.map(s => `
        <div class="card">
          <span class="tag">${s.tag}</span>
          <h3>${s.name}</h3>
          <p class="small text-muted">${s.full}</p>
          <h3>${s.amount}</h3>
          <p>${s.desc}</p>
          <p class="small text-muted"><b>Who can apply:</b> ${s.eligibility}</p>
        </div>`).join('');
    }

    document.querySelectorAll('#filters button').forEach(b => {
      b.onclick = () => {
        document.querySelectorAll('#filters button').forEach(x => x.classList.toggle('active', x === b));
        showSchemes(b.textContent);
      };
    });

    showSchemes('All');
  </script>
</body>
</html>
